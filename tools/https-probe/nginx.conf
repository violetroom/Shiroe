events {}

http {
    server_tokens off;

    # shortcut: temporary unauthenticated probe, replace before serving research state.
    server {
        listen 8443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "shiroe-https-connectivity-ok\n";
        }

        location / {
            return 404;
        }
    }
}
